<!doctype html><html><head><meta charset="utf-8"><title>layout check</title></head>
<body><div id="app"></div><pre id="out"></pre>
<script>
  window.onerror = (m, s, l, c, e) => {
    document.getElementById('out').textContent = 'ERR ' + m + '\n' + (e && e.stack)
  }
</script>
<script type="module" src="./app.js"></script>
<script type="module">
  setTimeout(async () => {
    try {
      document.getElementById('out').textContent = JSON.stringify(await window.__probe(), null, 1)
      const t = new URLSearchParams(location.search).get('t')
      if (t !== null) { document.getElementById('out').style.display = 'none'; window.__seek(+t) }
    } catch (e) {
      document.getElementById('out').textContent = 'ERR ' + e + '\n' + e.stack
    }
    document.title = 'done'
  }, 400)
</script></body></html>
